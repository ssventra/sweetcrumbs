# bakery-qa gate + GitHub Pages deploy (research.md R14, constitution VI).
# Pull requests run the checks only; pushes to main deploy site/ after both checks pass.
name: QA and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only by default; only the deploy job may publish to Pages.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  qa:
    name: bakery-qa
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Install QA tools
        run: npm ci

      - name: menu-check
        run: npm run menu-check

      - name: site-audit (unit tests, static audit, Lighthouse)
        run: npm run site-audit -- --lighthouse

      - name: Keep Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          if-no-files-found: ignore

  deploy:
    name: Deploy to GitHub Pages
    needs: qa
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v5
